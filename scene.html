<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Morgue Night Watchman</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; }
canvas { background: #0a0a12; display: block; }
</style>
</head>
<body>
<canvas id="morgueCanvas" width="1280" height="720"></canvas>
<script>
const canvas = document.getElementById('morgueCanvas');
const ctx = canvas.getContext('2d');
const WIDTH = 1280, HEIGHT = 720, DURATION = 10;
const START_X = -80, END_X = 700, WALK_DURATION = 7, FREEZE_TIME = 7, BELL_TIME = 6.5, GROUND_Y = 620;
function drawTable(x, y, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.fillStyle = '#3a3f4a'; ctx.fillRect(-90, 0, 12, 90); ctx.fillRect(78, 0, 12, 90);
  ctx.fillStyle = '#2d323d'; ctx.fillRect(-100, -15, 200, 20);
  ctx.fillStyle = '#e8e8e8'; ctx.beginPath();
  ctx.moveTo(-85, -15); ctx.lineTo(-75, -65); ctx.quadraticCurveTo(-60, -85, -35, -70);
  ctx.lineTo(10, -55); ctx.quadraticCurveTo(40, -75, 65, -60); ctx.lineTo(85, -15);
  ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#b0b0b0'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(-40, -30); ctx.lineTo(20, -35); ctx.moveTo(35, -45); ctx.lineTo(70, -25); ctx.stroke();
  ctx.restore();
}
function drawBell(x, y, t) {
  let angle = 0;
  if (t >= BELL_TIME) { let rt = t - BELL_TIME; angle = Math.sin(rt * 18) * 0.4 * Math.exp(-rt * 0.8); }
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, 0); ctx.stroke();
  ctx.fillStyle = '#d4a017'; ctx.beginPath();
  ctx.moveTo(-25, 30); ctx.quadraticCurveTo(-30, -5, 0, -5); ctx.quadraticCurveTo(30, -5, 25, 30);
  ctx.quadraticCurveTo(0, 38, -25, 30); ctx.fill();
  ctx.strokeStyle = '#8c6d00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(0, 38, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (t >= BELL_TIME) {
    let rt = t - BELL_TIME; let alpha = Math.max(0, 0.9 - rt * 0.4);
    ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y + 15, 45 + rt * 35, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y + 15, 65 + rt * 35, -0.9, 0.9); ctx.stroke(); ctx.restore();
  }
}
function drawStickman(x, groundY, t, isScared) {
  ctx.save(); ctx.translate(x, groundY);
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#f5f5f5'; ctx.fillStyle = '#f5f5f5';
  let headY = -115, hipY = -60, footY = 0;
  let walkPhase = t * (Math.PI * 2) * 1.4;
  let leg1Angle = isScared ? 0 : Math.sin(walkPhase) * 0.45;
  let leg2Angle = isScared ? 0 : Math.sin(walkPhase + Math.PI) * 0.45;
  let arm1Angle = isScared ? -1.3 : Math.sin(walkPhase + Math.PI) * 0.45 + 0.15;
  let arm2Angle = isScared ? -1.3 : Math.sin(walkPhase) * 0.45 + 0.15;
  let bob = isScared ? 0 : Math.abs(Math.sin(walkPhase)) * -4;
  ctx.translate(0, bob);
  ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(Math.sin(leg1Angle) * 45, footY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(Math.sin(leg2Angle) * 45, footY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(0, headY + 15); ctx.stroke();
  let shoulderY = headY + 35;
  ctx.beginPath(); ctx.moveTo(0, shoulderY); ctx.lineTo(Math.sin(arm1Angle) * 45, shoulderY + Math.cos(arm1Angle) * 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, shoulderY); ctx.lineTo(Math.sin(arm2Angle) * 45, shoulderY + Math.cos(arm2Angle) * 40); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, headY, 24, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  if (!isScared) {
    ctx.beginPath(); ctx.arc(8, headY - 4, 3, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#FFF';
    ctx.beginPath(); ctx.arc(6, headY - 6, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(19, headY - 6, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(8, headY - 4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(21, headY - 4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(13, headY + 12, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function render(t) {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = '#0a0a12'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = '#14141e'; ctx.fillRect(0, 0, WIDTH, 550);
  ctx.fillStyle = '#1d1d2b'; ctx.fillRect(0, 540, WIDTH, 10);
  ctx.fillStyle = '#1a1a22'; ctx.fillRect(0, 550, WIDTH, 170);
  ctx.fillStyle = '#282831';
  for (let i = 0; i < WIDTH; i += 80) ctx.fillRect(i, 630, 2, 90);
  ctx.fillStyle = '#232333'; ctx.fillRect(60, 100, 140, 320);
  ctx.strokeStyle = '#333344'; ctx.lineWidth = 2;
  for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(60, 100 + i * 64); ctx.lineTo(200, 100 + i * 64); ctx.stroke(); }
  ctx.fillStyle = '#333344'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.fillText('MORGUE', 130, 90);
  ctx.fillStyle = '#05050a'; ctx.fillRect(900, 110, 180, 120);
  ctx.fillStyle = '#3a3a4a'; ctx.fillRect(985, 110, 10, 120); ctx.fillRect(900, 165, 180, 10);
  ctx.fillStyle = '#dcdce8'; ctx.beginPath(); ctx.arc(1020, 145, 18, 0, Math.PI * 2); ctx.fill();
  drawTable(320, 480, 1.1); drawTable(580, 500, 0.95); drawTable(860, 490, 1.05);
  drawBell(1120, 180, t);
  let count = t < BELL_TIME ? 9 : 10;
  ctx.save(); ctx.textAlign = 'center'; ctx.font = 'bold 38px "Courier New", monospace'; ctx.shadowBlur = 10;
  if (count === 10) { ctx.fillStyle = (Math.floor(t * 10) % 2 === 0) ? '#ef4444' : '#dc2626'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 15; }
  else { ctx.fillStyle = '#22c55e'; ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 10; }
  ctx.fillText('CORPSES: ' + count, WIDTH / 2, 50);
  ctx.restore();
  let progress = Math.min(t / WALK_DURATION, 1);
  let xPos = START_X + (END_X - START_X) * progress;
  let isScared = t >= FREEZE_TIME;
  if (isScared) {
    xPos = END_X + Math.sin(t * 45) * 1.2;
    ctx.save();
    let gradient = ctx.createRadialGradient(xPos, GROUND_Y - 80, 10, xPos, GROUND_Y - 80, 180);
    gradient.addColorStop(0, 'rgba(255, 255, 200, 0.12)'); gradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
    ctx.fillStyle = gradient; ctx.fillRect(xPos - 200, GROUND_Y - 280, 400, 400);
    ctx.restore();
  }
  drawStickman(xPos, GROUND_Y, t, isScared);
}
let startTime = null;
function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  let elapsed = (timestamp - startTime) / 1000;
  if (elapsed > DURATION) { startTime = timestamp; elapsed = 0; }
  render(elapsed);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
window.renderAt = t => { render(t); return canvas.toDataURL('image/jpeg', 0.9); };
window.ready = true;
</script>
</body>
</html>
