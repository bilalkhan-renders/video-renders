name: painted-chunks
on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "JSON list of chunk indices, e.g. [6,11]"
        required: true
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        working-directory: painted
      - run: node render-film.mjs
        working-directory: painted
        env: { CHUNK: "${{ matrix.chunk }}", NCHUNKS: "20", FPS: "8", DUR: "326" }
      - uses: actions/upload-artifact@v4
        with: { name: "film-chunk-${{ matrix.chunk }}", path: painted/frames }
