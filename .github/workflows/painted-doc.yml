name: painted-doc
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        working-directory: painted
      - run: node render-doc.mjs
        working-directory: painted
        env: { CHUNK: "${{ matrix.chunk }}", NCHUNKS: "8", FPS: "8", DUR: "20" }
      - uses: actions/upload-artifact@v4
        with: { name: "doc-chunk-${{ matrix.chunk }}", path: painted/frames }
