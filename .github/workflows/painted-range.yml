name: painted-range
on:
  workflow_dispatch:
    inputs:
      ranges:
        description: "JSON list of {s,e} absolute frame ranges"
        required: true
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        range: ${{ fromJSON(inputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        working-directory: painted
      - run: node render-range.mjs
        working-directory: painted
        env: { FSTART: "${{ matrix.range.s }}", FEND: "${{ matrix.range.e }}", FPS: "8" }
      - uses: actions/upload-artifact@v4
        with: { name: "film-range-${{ matrix.range.s }}", path: painted/frames }
